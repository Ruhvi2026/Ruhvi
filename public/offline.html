<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#09090b">
  <title>You're Offline — Ruhvi Jewels</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --bg: light-dark(#FAFAF8, #09090b);
      --text: light-dark(#1a1a1a, #e5e5e5);
      --heading: light-dark(#09090b, #f5f5f5);
      --muted: light-dark(#555, #999);
      --icon-bg: light-dark(#F5F0E8, #1a1a1a);
      --icon-color: light-dark(#B8860B, #D4AF37);
      --btn-bg: light-dark(#09090b, #D4AF37);
      --btn-text: light-dark(#fff, #09090b);
      --btn-hover: light-dark(#222, #c9a430);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
    }
    .icon-wrapper {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-wrapper svg {
      width: 48px;
      height: 48px;
      color: var(--icon-color);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--heading);
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--btn-text);
      background: var(--btn-bg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry:hover { background: var(--btn-hover); }
    .btn-retry:active { transform: scale(0.97); }
    .btn-retry:focus-visible { outline: 2px solid #B8860B; outline-offset: 2px; }
    .brand {
      margin-top: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      opacity: 0.5;
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    .brand span {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <!-- Wi-Fi Off icon (Lucide-style SVG) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>
      It looks like your internet connection is unavailable right now.
      Please check your Wi‑Fi or mobile data and try again.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      Try Again
    </button>
    <div class="brand">
      <img src="/android-chrome-192x192.png" alt="Ruhvi" width="28" height="28">
      <span>Ruhvi Jewels</span>
    </div>
  </div>
</body>
</html>
