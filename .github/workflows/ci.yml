name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      # Safe dummy build environment variables for Next.js compilation
      NEXT_PUBLIC_APP_URL: https://ruhvi.in
      NEXT_PUBLIC_SUPABASE_URL: https://igrkrkxdantrolbldapj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_ci
      SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key_for_ci
      SUPABASE_JWT_SECRET: dummy_jwt_secret_for_ci_test_token_validation
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      WALLET_INTERNAL_SECRET: dummy_wallet_secret
      CRON_SECRET: dummy_cron_secret
      LIVEKIT_URL: wss://dummy.livekit.cloud
      LIVEKIT_API_KEY: dummy_livekit_key
      LIVEKIT_API_SECRET: dummy_livekit_secret
      RESEND_API_KEY: re_dummy_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint verification (ESLint)
        run: npm run lint

      - name: TypeScript type verification
        run: npm run typecheck

      - name: Cloudflare Worker type verification
        run: npx tsc -p cloudflare/cofounder-data-api/tsconfig.json

      - name: Cloudflare Worker bundle verification
        run: npx esbuild cloudflare/cofounder-data-api/src/index.ts --bundle --format=esm --target=esnext --outfile=cloudflare/cofounder-data-api/dist/index.js

      - name: Cloudflare Worker unit tests (TEST-01)
        run: cd cloudflare/cofounder-data-api && npm test

      - name: Run automated test suites (Jest)
        run: npm run test:ci

      - name: AI Co-Founder & Workforce Evaluation Gate (Promptfoo)
        run: npm run ai:eval
        env:
          NODE_ENV: test
          AI_EVAL_MODE: fixture
          CO_FOUNDER_PRIMARY_MODEL: gemini-3.5-flash

      - name: Upload AI Evaluation Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-evaluation-report
          path: promptfoo-report.json
          retention-days: 14

      - name: Production build validation
        run: npm run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
